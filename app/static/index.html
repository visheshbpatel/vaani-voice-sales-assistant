<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaani</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Vaani</h1>
      <p class="disclaimer">
        Unofficial prototype: real-time AI voice sales assistant for Surefy
        (Sankar Group intern assignment). Not an official Surefy product.
      </p>
      <p id="status" class="status">ended</p>
      <p class="duration">Duration: <span id="duration">00:00</span></p>
      <p id="error" class="error" hidden></p>
      <section>
        <h2>Conversation</h2>
        <div id="transcript" class="transcript" aria-live="polite">
          <p class="transcript-empty">Transcript will appear here when available.</p>
        </div>
        <p class="transcript-note">Transcript is auto-generated and may contain errors.</p>
      </section>
      <div class="actions">
        <button id="start" type="button">Start Call</button>
        <button id="end" type="button" disabled>End Call</button>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
